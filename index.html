<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Planner - Loading...</title>
    <meta http-equiv="refresh" content="0; url=frontend/index.html">
    <style>
        :root,
        [data-theme="dark"] {
            --bg: #0b0f19;
            --text: #f1f5f9;
            --primary: #6366f1;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .loading-box {
            text-align: center;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(99, 102, 241, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto 1rem auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <script>
        // Apply saved theme
        const savedTheme = localStorage.getItem('study_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        // Instant redirect
        window.location.replace("frontend/index.html");
    </script>
</head>

<body>
    <div class="loading-box">
        <div class="spinner"></div>
        <h2>Opening AI Study Planner...</h2>
        <p>If you are not redirected automatically, <a href="frontend/index.html" style="color: #6366f1;">click
                here</a>.</p>
    </div>
</body>

</html>
