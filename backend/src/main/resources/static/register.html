<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - AI Study Planner</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background-color: var(--bg-main); display: flex; flex-direction: column; min-height: 100vh;">
    <!-- Navigation -->
    <header class="navbar" id="navbar"></header>

    <main class="container" style="display: flex; align-items: center; justify-content: center; flex: 1;">
        <div class="card" style="width: 100%; max-width: 480px; padding: 2.25rem 2rem;">
            <div style="text-align: center; margin-bottom: 1.75rem;">
                <div style="font-size: 2.25rem; margin-bottom: 0.5rem;">📝</div>
                <h1 style="font-size: 1.5rem; margin-bottom: 0.35rem;">Create Student Account</h1>
                <p style="color: var(--text-muted); font-size: 0.875rem;">Set up your personal study environment and generate AI plans</p>
            </div>

            <div id="errorAlert" style="display: none; padding: 0.75rem 1rem; border-radius: var(--radius-md); background: var(--danger-bg); border: 1px solid #fca5a5; color: var(--danger-text); font-size: 0.875rem; margin-bottom: 1.25rem;"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label" for="fullName">Full Name</label>
                    <input type="text" id="fullName" class="form-control" placeholder="Alex Taylor" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Student / University Email</label>
                    <input type="email" id="email" class="form-control" placeholder="alex@university.edu" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="At least 6 characters" required autocomplete="new-password">
                    <div class="form-hint">Must contain at least 6 characters.</div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter your password" required autocomplete="new-password">
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 0.5rem;">
                    <span id="btnText">Create Account</span>
                    <span id="btnSpinner" class="spinner" style="display: none;"></span>
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted);">
                Already have an account? <a href="/login.html" style="font-weight: 600;">Log in here</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer" id="footer"></footer>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Guard: If already logged in, redirect to dashboard
            auth.guard(false);

            ui.renderNavbar('register');
            ui.renderFooter();

            const registerForm = document.getElementById('registerForm');
            const fullNameInput = document.getElementById('fullName');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const errorAlert = document.getElementById('errorAlert');

            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorAlert.style.display = 'none';

                const fullName = fullNameInput.value.trim();
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;

                // Client-side validations
                if (!fullName || !email || !password || !confirmPassword) {
                    errorAlert.textContent = 'Please fill out all required fields.';
                    errorAlert.style.display = 'block';
                    return;
                }

                if (password.length < 6) {
                    errorAlert.textContent = 'Password must be at least 6 characters long.';
                    errorAlert.style.display = 'block';
                    return;
                }

                if (password !== confirmPassword) {
                    errorAlert.textContent = 'Password and Confirm Password do not match.';
                    errorAlert.style.display = 'block';
                    return;
                }

                // Show loading state
                submitBtn.disabled = true;
                btnText.textContent = 'Creating Account...';
                btnSpinner.style.display = 'inline-block';

                try {
                    const response = await api.post('/auth/register', {
                        fullName,
                        email,
                        password,
                        confirmPassword
                    });

                    auth.saveSession(response);
                    ui.showToast('Account registered successfully! Welcome to AI Study Planner.', 'success');

                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 500);
                } catch (error) {
                    errorAlert.textContent = error.message || 'Registration failed. An account with this email may already exist.';
                    errorAlert.style.display = 'block';
                } finally {
                    submitBtn.disabled = false;
                    btnText.textContent = 'Create Account';
                    btnSpinner.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
