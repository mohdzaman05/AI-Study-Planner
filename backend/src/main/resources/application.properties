# ==========================================================
# AI Study Planner - Spring Boot Default Configuration
# Defaults to file-persisted H2 in MySQL-compatibility mode for zero-friction setup.
# Easily override with MySQL environment variables when deployed.
# ==========================================================

# Server Configuration
server.port=8080
server.error.include-message=always

# Database Configuration (Defaults to embedded H2 MySQL mode; seamlessly overridden by ENV vars for MySQL)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/studyplanner;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console (available at /h2-console for inspection during development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JWT Configuration (HMAC-SHA256 256-bit secret)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=86400000

# Google Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-1.5-flash}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

# Serve Frontend static assets directly from frontend directory
spring.web.resources.static-locations=file:../frontend/,file:./frontend/,classpath:/static/
